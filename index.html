<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ハチドリさんのお店マップ（サンプル版）</title>
  <meta name="description" content="ハチドリ電力を使っているお店のマップ（サンプル版）。表示しているお店は架空のものです。">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FEFEF2">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Poppins:wght@600;700&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <p class="header__brand"><span class="header__mark" aria-hidden="true"></span>ハチドリ電力</p>
      <h1 class="header__title">ハチドリさんのお店マップ</h1>
    </header>

    <p class="sample-banner" role="note">これはサンプル版です。表示しているお店は架空のものです</p>

    <nav class="filter" aria-label="ジャンルで絞り込む">
      <div class="filter__chips" id="filter"></div>
    </nav>

    <main class="map-wrap">
      <div id="map" class="map" role="region" aria-label="お店の地図"></div>
      <button id="locate" class="locate-btn" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
        現在地のまわりを見る
      </button>
      <div id="map-error" class="map-error" role="alert" hidden>
        <p>うまく表示できませんでした。少し時間をおいて、もう一度開いてみてください</p>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
  </div>

  <a id="feedback" class="fab" target="_blank" rel="noopener" hidden>
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>
    ご意見を送る
  </a>

  <div id="sheet-backdrop" class="sheet-backdrop"></div>
  <section id="sheet" class="sheet" role="dialog" aria-labelledby="sheet-title"></section>

  <div id="onboarding" class="modal" hidden>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="onboarding-title">
      <p class="modal__eyebrow">はじめての方へ</p>
      <h2 class="modal__title" id="onboarding-title">ハチドリ電力を使っているお店のマップを試作しました！</h2>
      <p>いまはサンプル版なので、のっているお店は架空のものです。</p>
      <p>「こんな情報があったらうれしい」「ここが見づらい」など、ぜひ広場で教えてください☺️</p>
      <button type="button" class="btn btn--primary modal__button" data-close>さっそく見てみる</button>
    </div>
  </div>

  <script>
    // ファイルを直接開くとモジュールとデータが読み込めないため、案内を出す
    if (location.protocol === 'file:') {
      var err = document.getElementById('map-error');
      err.querySelector('p').textContent = 'ファイルを直接開くと地図を表示できません。フォルダで「npx serve .」を実行し、表示されたURL（http://localhost:…）で開いてください。';
      err.hidden = false;
    }
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js" crossorigin=""></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
